name: kaggle-push
# Pushes the Kaggle run kept at kaggle/<run>/kernel (kernel-metadata.json + menga_wan22.py).
on:
  workflow_dispatch:
    inputs:
      run: {description: "run name, e.g. 2026-11-09-a", required: true}
permissions:
  contents: read
concurrency: {group: kaggle, cancel-in-progress: false}
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet kaggle==2.2.5 six
      - name: Kaggle credentials (from the repo secret; never printed)
        env: {KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_API_TOKEN }}"}
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo "secret KAGGLE_API_TOKEN is missing"; exit 1; }
          mkdir -p ~/.kaggle && printf '%s' "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token && chmod 600 ~/.kaggle/access_token
      - name: Push
        env: {KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_API_TOKEN }}"}
        run: kaggle kernels push -p "kaggle/${{ inputs.run }}/kernel" --accelerator NvidiaTeslaT4
